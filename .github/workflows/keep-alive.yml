name: keep-alive

# Streamlit Community Cloud puts an app to sleep after a stretch with no viewers,
# and the first person to open it then sees a "Zzzz" page and a wake button.
# This job opens the app in a headless browser every six hours so that never
# happens to someone arriving from the README or a resume link. If the app is
# asleep it presses the wake button and waits for the app to render, so the
# job doubles as a smoke test: it fails if the app cannot boot.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Open the app and wait for it to render
        run: |
          cat > visit.mjs <<'EOF'
          import { chromium } from "playwright";

          const url = "https://cre-credit-risk.streamlit.app/";
          const browser = await chromium.launch();
          const page = await browser.newPage();
          try {
            await page.goto(url, { waitUntil: "domcontentloaded", timeout: 90_000 });

            // The sleep screen's wake button lives in a nested frame, not the top-level
            // page, same as the app content once it boots. page.getByRole only searches
            // the top-level page, so it silently never matched: the click never fired,
            // and every run since this was added has timed out waiting for an app that
            // was never actually told to wake up. Search every frame instead, the same
            // way the render-check loop below already does.
            let clicked = false;
            for (const frame of page.frames()) {
              const wake = frame.getByRole("button", { name: /get this app back up/i });
              if (await wake.isVisible({ timeout: 5_000 }).catch(() => false)) {
                console.log(`app was asleep (wake button found in frame ${frame.url()}); pressing it`);
                await wake.click();
                clicked = true;
                break;
              }
            }
            if (!clicked) console.log("no wake button found; app may already be awake");

            // The app title comes from st.title("CRE Credit Risk"); look for it in the
            // page or any frame for up to five minutes (a cold boot that has to install
            // pandas, matplotlib, reportlab and plotly can take a while).
            const deadline = Date.now() + 300_000;
            let rendered = false;
            while (!rendered && Date.now() < deadline) {
              for (const frame of page.frames()) {
                const hits = await frame.locator("text=CRE Credit Risk").count().catch(() => 0);
                if (hits > 0) { rendered = true; break; }
              }
              if (!rendered) {
                console.log(`still waiting, ${Math.round((deadline - Date.now()) / 1000)}s left`);
                await page.waitForTimeout(10_000);
              }
            }
            if (!rendered) throw new Error("app did not render within five minutes");

            // Hold the session open briefly so the visit registers as viewer traffic.
            await page.waitForTimeout(20_000);
            console.log("app rendered; visit complete");
          } finally {
            await browser.close();
          }
          EOF
          node visit.mjs
